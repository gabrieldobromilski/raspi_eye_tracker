[project]
name = "eyetracker"
version = "0.1.0"
description = "Budget eyetracker for Raspberry Pi systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.7",
    "mediapipe>=0.10.14",
    "numpy>=2.2.6",
    "onnxruntime>=1.23.2",
    "opencv-python>=4.11.0.86",
    "picamera2>=0.3.31",
    "pygame>=2.6.1",
    "scikit-learn>=1.7.2",
    "tensorflow>=2.14.0",
    "ultralytics>=8.3.220",
]
